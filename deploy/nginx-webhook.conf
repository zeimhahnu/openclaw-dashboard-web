# ─────────────────────────────────────────────────────────────────────────────
# nginx deployment webhook config snippet
# Add to /etc/nginx/sites-available/dashboard (or included in server { } block)
# ─────────────────────────────────────────────────────────────────────────────

location /deploy {
    # Deny access to browsers, allow curl from anywhere
    limit_except GET POST { deny all; }

    # Token passed as ?token=<secret>
    # Webhook calls from Lil Claw will use: curl -X POST https://dashboard.vpszeimhahnu.uk/deploy?token=<secret>
    if ($arg_token = "CHANGE_ME_TO_A_RANDOM_SECRET") {
        proxy_pass http://unix:/tmp/deploy.sock;
    }

    return 204;  # no token = silent 204 (no info leak)
}

# Alternative: proxy to a systemd service or a small FastAPI listener.
# Simpler approach — let deploy.sh handle the full rebuild:
# location /deploy {
#     proxy_pass http://127.0.0.1:8444/deploy;
# }